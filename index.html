<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VaultFlow — Track Subscriptions &amp; Renewal Dates</title>
    <meta
      name="description"
      content="Find every subscription you pay for without connecting your bank, and get reminded before every renewal."
    />
    <meta property="og:title" content="VaultFlow — Track Subscriptions & Renewal Dates" />
    <meta
      property="og:description"
      content="Find every subscription you pay for without connecting your bank, and get reminded before every renewal."
    />
    <meta name="theme-color" content="#1E6B58" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VaultFlow" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('vaultflow_theme_v1') || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-page text-text-primary antialiased selection:bg-brand/15 selection:text-text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
